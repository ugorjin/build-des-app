# Render Blueprint: https://render.com/docs/blueprint-spec
# Free plan: no persistent disk, so the database and uploads live on the
# instance's temporary filesystem. Every restart, redeploy or sleep/wake cycle
# starts from an empty database, which SEED_DEMO refills with sample data.
# For real use, switch to a paid plan and add a disk mounted at DATA_DIR.
services:
  - type: web
    name: plan-vault
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: SECURE_COOKIES
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      # Password for the "admin" account. Find it under Environment in the
      # Render dashboard. Because the free plan resets the database, this is the
      # password after every restart (a changed password does not persist).
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO
        value: "1"
